<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блогеры — рабочий стол</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1d1b19;--mute:#76706a;--line:#e7e2dc;--accent:#6b4f3a;--accent-soft:#efe7df;
--ok:#2f7d4f;--ok-bg:#e3f2e9;--warn:#a35f00;--warn-bg:#fdf0d8;--bad:#b3362b;--bad-bg:#fbe4e1;--info:#33567f;--info-bg:#e4ecf6;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#171513;--card:#211e1b;--ink:#f1ede8;--mute:#9c948b;--line:#33302b;--accent:#d4b79c;--accent-soft:#2e2822;
--ok:#6fcf97;--ok-bg:#1c2e24;--warn:#f2b45c;--warn-bg:#35290f;--bad:#ff8b7f;--bad-bg:#3a1f1c;--info:#8db6ea;--info-bg:#1c2836}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:22px;margin:0}.sub{color:var(--mute);font-size:13px;margin-top:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{color:var(--mute);font-size:12.5px}.kpi small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.sec h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.cnt{background:var(--accent-soft);color:var(--accent);border-radius:99px;font-size:12px;padding:1px 8px}
.todo{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.t{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:var(--bg)}
.t:hover{border-color:var(--accent)}.t .n{font-weight:600}.t .w{font-size:12.5px;margin-top:2px}
.w.bad{color:var(--bad)}.w.warn{color:var(--warn)}.w.info{color:var(--info)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:40px}
input[type=search]{flex:1 1 220px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer;min-height:34px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip i{font-style:normal;opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600;cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--accent-soft)}tr:last-child td{border-bottom:0}
.nm{font-weight:600}.art{color:var(--mute);font-size:12px}
.st{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:500}
.s-Согласование{background:var(--warn-bg);color:var(--warn)}.s-Запланировано{background:var(--info-bg);color:var(--info)}
.s-Опубликовано{background:var(--accent-soft);color:var(--accent)}.s-Результаты{background:var(--ok-bg);color:var(--ok)}
.pl{font-size:12.5px;color:var(--mute)}
.cards{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;font-size:13px}
.card .g span{color:var(--mute);display:block;font-size:11.5px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.drawer.on{display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(440px,100%);height:100%;overflow:auto;padding:18px 18px 40px;animation:in .18s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:0}}
.panel h3{margin:0;font-size:20px}.x{float:right;border:0;background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.m span{display:block;color:var(--mute);font-size:12px}.m b{font-size:17px;font-variant-numeric:tabular-nums}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rows div span:first-child{color:var(--mute)}
a.btn{display:block;text-align:center;margin-top:14px;background:var(--accent);color:var(--bg);text-decoration:none;border-radius:10px;padding:11px;font-weight:600}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 11px;font-size:13.5px;margin-top:10px}
.foot{color:var(--mute);font-size:12px;margin-top:18px}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.tbl{display:none}.cards{display:block}.kpi b{font-size:19px}}
</style>
</head>

<div class="wrap">
<header><div><h1>Блогеры</h1><div class="sub" id="sub"></div></div>
<select id="plat" aria-label="Площадка"><option value="">Все площадки</option></select></header>
<div class="kpis" id="kpis"></div>
<div class="sec" id="todoBox"><h2>Требует внимания <span class="cnt" id="todoCnt"></span></h2><div class="todo" id="todo"></div><button class="chip" id="more" style="margin-top:10px" hidden></button></div>
<div class="chips" id="chips"></div>
<div class="tools">
<input type="search" id="q" placeholder="Поиск: блогер, артикул, комментарий" aria-label="Поиск">
<select id="bud" aria-label="Бюджет"><option value="">Любой бюджет</option><option>Платное размещение</option><option>Бартер</option></select>
<select id="sort" aria-label="Сортировка">
<option value="date">Сначала ближайшие даты</option><option value="cpm">CPM: дешёвые сверху</option><option value="-cpm">CPM: дорогие сверху</option>
<option value="-reach">Охват: больше сверху</option><option value="-subs">Подписчики: больше сверху</option><option value="-cost">Стоимость: выше сверху</option></select>
</div>
<div class="tbl"><table><thead><tr><th data-s="name">Блогер</th><th>Площадка</th><th>Статус</th><th data-s="date">Дата</th><th class="r" data-s="-subs">Подписчики</th><th class="r" data-s="-reach">Охват сторис</th><th class="r" data-s="-cost">Стоимость</th><th class="r" data-s="cpm">CPM</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="cards" id="cards"></div>
<div class="empty" id="empty" hidden>Ничего не найдено. Сбросьте фильтры.</div>
<div class="foot">Демонстрационные данные. CPM = стоимость размещения / охват сторис × 1000. Расходы по бартеру считаются по себестоимости товара.</div>
</div>
<div class="drawer" id="dr"><div class="panel" id="pn"></div></div>

му": "https://example.com/demo-24", "Комментарий": "Демонстрационные данные"}];
// порядок статусов = путь размещения от согласования до результатов

const rub=n=>fmt(n)+' ₽';
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' млн':n>=1e3?(n/1e3).toFixed(n>=1e5?0:1).replace('.',',')+' тыс':String(n);
const today=new Date();today.setHours(0,0,0,0);
const dd=s=>new Date(s+'T00:00:00');
const dfmt=s=>dd(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const safeUrl=u=>/^https?:\/\//.test(u)?u:'#';

reach:d['Охват сторис'],views:d['Просмотры рилс'],cost:d['Стоимость размещения, ₽'],cogs:d['Себестоимость товара, ₽'],fmt:d['Формат рекламы'],status:d['Статус'],date:d['Дата рекламы'],link:d['Ссылка на рекламу'],note:d['Комментарий']}));

rows.forEach(r=>{r.cpm=r.reach?r.cost/r.reach*1000:0;r.er=r.subs?r.reach/r.subs*100:0;

 r.todo=null;
 if((r.status==='Согласование'||r.status==='Запланировано')&&late)r.todo={t:'Дата прошла — обновите статус',c:'bad'};
 else if((r.status==='Согласование'||r.status==='Запланировано')&&days<=2)r.todo={t:days===0?'Выход сегодня':'Выход через '+days+' дн.',c:'warn'};
 else if(r.status==='Опубликовано')r.todo={t:'Опубликовано — внесите результаты',c:'info'};
 r.hay=(r.name+' '+r.art+' '+r.note+' '+r.plat+' '+r.fmt).toLowerCase();});
// показываем 4 задачи, остальные по кнопке
let allTodo=false;
const S={status:'',plat:'',bud:'',q:'',sort:'date'};
[...new Set(rows.map(r=>r.plat))].forEach(p=>{const o=document.createElement('option');o.textContent=p;$('plat').append(o)});
// строки после фильтров площадки, бюджета и поиска (статус применяется отдельно, чтобы считать счётчики чипов)
function base(){return rows.filter(r=>(!S.plat||r.plat===S.plat)&&(!S.bud||r.bud===S.bud)&&(!S.q||r.hay.includes(S.q)))}
// ключ с минусом = по убыванию
function sorted(a){const s=S.sort,k=s.replace('-',''),m=s[0]==='-'?-1:1;
 return [...a].sort((x,y)=>k==='date'?dd(x.date)-dd(y.date):k==='name'?x.name.localeCompare(y.name,'ru'):(x[k]-y[k])*m)}
// перерисовываем всё целиком, данных мало
function render(){
 const b=base(), v=b.filter(r=>!S.status||r.status===S.status);
 const paid=b.filter(r=>r.bud==='Платное размещение'),bar=b.filter(r=>r.bud==='Бартер');
 const sp=paid.reduce((s,r)=>s+r.cost,0),goods=bar.reduce((s,r)=>s+r.cogs,0);
 const rs=paid.reduce((s,r)=>s+r.reach,0),avg=rs?sp/rs*1000:0;
 const best=[...paid].sort((x,y)=>x.cpm-y.cpm)[0];
 $('sub').textContent=b.length+' размещений · обновлено '+today.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
 $('kpis').innerHTML=[['Платные размещения',rub(sp),paid.length+' шт.'],['Бартер (себестоимость)',rub(goods),bar.length+' шт.'],
  ['Средний CPM',rub(avg),'платные, по охвату сторис'],['Лучший CPM',best?rub(best.cpm):'—',best?esc(best.name)+' · '+best.plat:'']]
  .map(k=>`<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b><small>${k[2]}</small></div>`).join('');

 $('chips').innerHTML=[['','Все',b.length],...STATUS.map(s=>[s,s,b.filter(r=>r.status===s).length])]
  .map(c=>`<button class="chip" aria-pressed="${S.status===c[0]}" data-st="${c[0]}">${c[1]}<i>${c[2]}</i></button>`).join('');
 const L=sorted(v);
 $('empty').hidden=!!L.length;
 $('tb').innerHTML=L.map(r=>`<tr data-i="${rows.indexOf(r)}"><td><div class="nm">${esc(r.name)}</div><div class="art">${esc(r.art)} · ${esc(r.fmt)}</div></td><td>${r.plat}<div class="pl">${r.bud==='Бартер'?'Бартер':'Платно'}</div></td>

 $('cards').innerHTML=L.map(r=>`<div class="card" data-i="${rows.indexOf(r)}"><div class="top"><div><div class="nm">${esc(r.name)}</div><div class="art">${r.plat} · ${r.bud==='Бартер'?'Бартер':'Платно'} · ${dfmt(r.date)}</div></div><span class="st s-${sk(r.status)}">${r.status}</span></div>

}
// карточка блогера
function open_(i){const r=rows[i];
 $('pn').innerHTML=`<button class="x" aria-label="Закрыть" id="cl">×</button><h3>${esc(r.name)}</h3><div class="art">${esc(r.art)} · ${r.plat} · ${esc(r.fmt)}</div>
 <div style="margin-top:8px"><span class="st s-${sk(r.status)}">${r.status}</span> <span class="pl">· ${dfmt(r.date)}</span></div>
 ${r.todo?`<div class="note">${r.todo.t}</div>`:''}
 <div class="grid2"><div class="m"><span>CPM</span><b>${rub(r.cpm)}</b></div><div class="m"><span>Охват / подписчики</span><b>${r.er.toFixed(1).replace('.',',')}%</b></div>
 <div class="m"><span>Стоимость</span><b>${rub(r.cost)}</b></div><div class="m"><span>Себестоимость товара</span><b>${rub(r.cogs)}</b></div></div>
 <div class="rows"><div><span>Подписчики</span><span>${fmt(r.subs)}</span></div><div><span>Охват сторис</span><span>${fmt(r.reach)}</span></div><div><span>Просмотры рилс</span><span>${fmt(r.views)}</span></div>
 <div><span>Возраст аудитории</span><span>${esc(r.age)}</span></div><div><span>Гео</span><span>${esc(r.geo)}</span></div><div><span>Бюджет</span><span>${esc(r.bud)}</span></div><div><span>Комментарий</span><span>${esc(r.note)}</span></div></div>
 <a class="btn" href="${safeUrl(r.link)}" target="_blank" rel="noopener">Открыть рекламу</a>`;
 $('dr').classList.add('on');$('cl').focus();}
const close_=()=>$('dr').classList.remove('on');
document.addEventListener('click',e=>{
 if(e.target.id==='more'){allTodo=!allTodo;render();return}
 const c=e.target.closest('[data-st]');if(c){S.status=c.dataset.st;render();return}
 const t=e.target.closest('[data-i]');if(t){open_(+t.dataset.i);return}
 const s=e.target.closest('th[data-s]');if(s){S.sort=s.dataset.s;$('sort').value=[...$('sort').options].some(o=>o.value===S.sort)?S.sort:'date';render();return}

document.addEventListener('keydown',e=>{if(e.key==='Escape')close_()});
$('q').oninput=e=>{S.q=e.target.value.trim().toLowerCase();render()};
$('plat').onchange=e=>{S.plat=e.target.value;render()};
